<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - FarmaVida PDV</title>
  <link rel="stylesheet" href="../styles/pharmacy-theme.css">
  <style>
    :root {
      --primary-color: #f57c00;
      --secondary-color: #ffa726;
      --accent-color: #1565c0;
      --text-color: #333;
      --light-bg: #f5f5f5;
      --border-color: #e0e0e0;
      --success-color: #43a047;
      --error-color: #e53935;
    }
    
    body {
      font-family: 'Roboto', Arial, sans-serif;
      background-color: var(--light-bg);
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-image: radial-gradient(circle at 20% 20%, rgba(32, 168, 120, .18), transparent 26%), linear-gradient(135deg, #edf9f5, #e6f4f7);
      background-size: cover;
    }
    
    .login-container {
      background-color: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 5px 25px rgba(0, 0, 0, 0.15);
      width: 380px;
      border-top: 5px solid var(--primary-color);
    }
    
    .login-header {
      text-align: center;
      margin-bottom: 30px;
    }
    
    .login-logo {
      margin-bottom: 15px;
    }
    
    .login-logo img {
      height: 60px;
      margin-bottom: 10px;
    }
    
    .login-header h1 {
      color: var(--primary-color);
      margin: 0;
      font-size: 28px;
      font-weight: 700;
    }
    
    .login-header p {
      color: #666;
      margin-top: 5px;
      font-size: 15px;
    }
    
    .form-group {
      margin-bottom: 20px;
      position: relative;
    }
    
    label {
      display: block;
      margin-bottom: 6px;
      color: var(--text-color);
      font-weight: 500;
      font-size: 14px;
    }
    
    input {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 15px;
      transition: border-color 0.2s;
    }
    
    input:focus {
      border-color: var(--primary-color);
      outline: none;
      box-shadow: 0 0 0 3px rgba(245, 124, 0, 0.2);
    }
    
    button {
      width: 100%;
      padding: 12px;
      background-color: var(--primary-color);
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
      font-weight: 600;
      transition: background-color 0.3s;
    }
    
    button:hover {
      background-color: var(--secondary-color);
    }
    
    .error-message {
      color: var(--error-color);
      margin: 8px 0;
      text-align: center;
      display: none;
      font-size: 14px;
      background-color: rgba(229, 57, 53, 0.1);
      padding: 8px;
      border-radius: 4px;
    }
    
    .login-footer {
      margin-top: 25px;
      text-align: center;
      font-size: 14px;
      color: #666;
    }
    
    .register-link {
      color: var(--accent-color);
      text-decoration: none;
      cursor: pointer;
      font-weight: 600;
    }
    
    .register-link:hover {
      text-decoration: underline;
    }
    
    /* Modal de registro */
    .modal {
      display: none;
      position: fixed;
      z-index: 1;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      overflow: auto;
      background-color: rgba(0,0,0,0.5);
    }
    
    .modal-content {
      background-color: white;
      margin: 6% auto;
      padding: 25px;
      border-radius: 10px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.2);
      width: 450px;
      border-top: 5px solid var(--accent-color);
    }
    
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 15px;
      border-bottom: 1px solid var(--border-color);
    }
    
    .modal-header h2 {
      margin: 0;
      color: var(--accent-color);
      font-size: 22px;
    }
    
    .close {
      color: #aaa;
      font-size: 28px;
      font-weight: bold;
      cursor: pointer;
    }
    
    .close:hover {
      color: #333;
    }
    
    .modal-footer {
      margin-top: 25px;
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      padding-top: 15px;
      border-top: 1px solid var(--border-color);
    }
    
    .btn-secondary {
      background-color: #e0e0e0;
      color: #333;
    }
    
    .btn-secondary:hover {
      background-color: #d0d0d0;
    }
    
    .register-btn {
      background-color: var(--accent-color);
    }
    
    .register-btn:hover {
      background-color: #0d47a1;
    }
    
    .version-info {
      position: absolute;
      bottom: 15px;
      right: 15px;
      font-size: 12px;
      color: #888;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-header">
      <div class="login-logo">
        <div style="font-size:54px; line-height:1" aria-label="FarmaVida">⚕️</div>
      </div>
      <h1>FarmaVida PDV</h1>
      <p>Gestão inteligente para sua farmácia</p>
    </div>
    
    <form id="loginForm">
      <div class="form-group">
        <label for="email">E-mail:</label>
        <input type="email" id="email" name="email" required autofocus placeholder="seu@email.com">
      </div>
      
      <div class="form-group">
        <label for="senha">Senha:</label>
        <input type="password" id="senha" name="senha" required placeholder="Sua senha">
      </div>
      
      <div id="errorMessage" class="error-message">
        Credenciais inválidas. Tente novamente.
      </div>
      
      <button type="submit">Entrar no Sistema</button>
    </form>
    
    <div class="login-footer">Novos acessos são cadastrados pela GERÊNCIA.</div>
  </div>

  <div class="version-info">Versão 1.0.0</div>
  <script src="../utils/electronInputFixer.js"></script>
  <script src="../scripts/login.js"></script>
</body>
</html>
